name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# a newer push supersedes an in-flight run on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

jobs:
  # Fast feedback: lint, types and pure-logic tests need no browser or build.
  static:
    name: Lint · Types · Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  # The Python orchestrator lives in backend/ (subtree-merged). Its own
  # backend/.github/workflows/ci.yml no longer runs — GitHub only reads the
  # root .github/workflows — so its suite is mirrored here step for step.
  backend:
    name: Orchestrator (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      # Same sys.path note as backend/.github/workflows/ci.yml: without this,
      # `from friday import ...` fails with ModuleNotFoundError.
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Whole unit + integration suites via backend/runtests.py — one command
      # that can never silently skip a new test file (the per-file list here
      # previously missed test_clock/test_contracts/test_runs/test_steps).
      # No pytest dependency; each file runs in its own process.
      - name: Unit tests
        run: python runtests.py unit

      - name: Integration tests
        run: python runtests.py integration

  # P0.5 contract gate: shared schemas <-> FE consumer + BE producer.
  # Needs both runtimes (Playwright unit specs need node, test_contracts.py
  # needs the backend deps) but no browser, no build, no model key — every
  # provider call in these paths is a deterministic fake.
  contracts:
    name: Contracts (FE consumer · BE producer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Contract tests
        run: npm run test:contracts

  # The hologram suite: builds the app, boots it and drives real WebGL.
  #
  # Sharded across runners rather than parallelised inside one. Every test
  # mounts a WebGL scene that rasterises on the CPU here, so extra workers on a
  # single machine only contend for cores — measured at 20.8 min and five
  # failures against 19 min green at one worker (see playwright.config.ts).
  # Separate runners have separate cores, and separate ports for the stub
  # orchestrator, so this is the split that actually pays.
  #
  # Two shards, not more: Playwright shards whole files, and this suite is a
  # handful of very uneven ones. Two lands roughly even halves by measured
  # per-file times — re-time if files are added or removed.
  ui:
    name: UI (WebGL) ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    # Measured ~19 min green at workers:1; 25 proved too thin once a systemic
    # breakage made every test burn its full timeout (CDN-less shared runners
    # also jitter). 30 costs nothing when green and leaves room to fail loudly.
    timeout-minutes: 30
    needs: static
    strategy:
      # one shard failing should not cancel the evidence from the others
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Browsers are ~150MB; keyed on the Playwright version in the lockfile.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
          # a version bump then installs only the new browser build on top of
          # the cached ones instead of re-downloading ~150MB from scratch;
          # restore-key hits set cache-hit=false, so the install step still runs
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Next's cache makes the production build inside webServer much faster.
      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          # src/** alone is not enough: a CSP edit (next.config.ts), a TS
          # strictness flip (tsconfig.json), PostCSS or public/ changes
          # (incl. the TTS worklet) must not reuse a stale build cache.
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs', 'public/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      # The suite's webServer runs `npm run build && npm run start`, so this
      # step also covers the production build.
      - name: UI tests
        run: npm run test:ui -- --shard=${{ matrix.shard }}/2

      # Artifact dirs may not exist when the run dies early (e.g. job timeout
      # kills the step before any test fails): uploading a missing path fails
      # the step, so guarantee the dirs first. Cheap and unconditional.
      - name: Ensure artifact dirs exist
        if: always()
        run: mkdir -p playwright-report test-results

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          # one name per shard: uploading both artifacts under one name fails
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

      - name: Upload failure traces
        # always(), not failure(): on a job timeout the run conclusion is
        # `cancelled`, yet every test that died before the kill already wrote
        # its trace.zip/screenshot — that partial evidence is exactly what a
        # systemic breakage (dead page, hung server) is debugged from.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # one name per shard: uploading both artifacts under one name fails
          name: playwright-traces-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
