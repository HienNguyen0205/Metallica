name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# a newer push supersedes an in-flight run on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Fast feedback: lint, types and pure-logic tests need no browser or build.
  static:
    name: Lint · Types · Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  # The hologram suite: builds the app, boots it and drives real WebGL.
  #
  # Sharded across runners rather than parallelised inside one. Every test
  # mounts a WebGL scene that rasterises on the CPU here, so extra workers on a
  # single machine only contend for cores — measured at 20.8 min and five
  # failures against 19 min green at one worker (see playwright.config.ts).
  # Separate runners have separate cores, and separate ports for the stub
  # orchestrator, so this is the split that actually pays.
  #
  # Two shards, not more: Playwright shards whole files, and this suite is four
  # very uneven ones. At three the split came out 22 / 0 / 10 — an idle runner
  # and no gain. Two lands friday+drilldown against hologram+memoryRail, which
  # by the measured per-file times is roughly 10 min against 8.5.
  ui:
    name: UI (WebGL) ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: static
    strategy:
      # one shard failing should not cancel the evidence from the others
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Browsers are ~150MB; keyed on the Playwright version in the lockfile.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Next's cache makes the production build inside webServer much faster.
      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      # The suite's webServer runs `npm run build && npm run start`, so this
      # step also covers the production build.
      - name: UI tests
        run: npm run test:ui -- --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          # one name per shard: uploading both artifacts under one name fails
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
